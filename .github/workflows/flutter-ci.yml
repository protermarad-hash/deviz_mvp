name: Flutter CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: dart analyze
        run: flutter analyze --no-fatal-infos

      # unawaited_return_in_try_block e coborât la info (analysis_options.yaml)
      # doar pentru cele 13 locuri existente din producția 122. Orice apariție
      # NOUĂ peste prag pică CI-ul — controlul rămâne activ pentru cod nou.
      - name: Prag unawaited_return_in_try_block (max 13 cunoscute)
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.txt || true
          count=$(grep -c 'unawaited_return_in_try_block' analyze.txt || true)
          echo "unawaited_return_in_try_block: $count (prag 13)"
          if [ "$count" -gt 13 ]; then
            echo "::error::Apariții noi unawaited_return_in_try_block ($count > 13). Adaugă await în try."
            exit 1
          fi

      - name: flutter test
        run: flutter test

  build-debug-apk:
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK (semnal de fum, fara semnare de release)
        run: flutter build apk --debug --flavor proterm
