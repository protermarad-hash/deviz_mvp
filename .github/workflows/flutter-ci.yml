name: Flutter CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.6'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: dart analyze
        run: flutter analyze --no-fatal-infos

      - name: flutter test
        run: flutter test

  build-debug-apk:
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.6'
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK (semnal de fum, fara semnare de release)
        run: flutter build apk --debug
